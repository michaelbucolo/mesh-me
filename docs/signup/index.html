<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - mesh.me</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            color: #ffffff;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(0,0,0,0.2);
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 1rem;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .auth {
            max-width: 400px;
            margin: 4rem auto;
            background-color: rgba(4,13,33,0.6);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .auth h1 {
            text-align: center;
            margin-top: 0;
        }
        .auth label {
            display: block;
            margin-bottom: 1rem;
        }
        .mesh-field {
            width: 100%;
            padding: 0.5rem;
            border-radius: 8px;
            border: none;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn-primary:hover {
            background-color: #2563eb;
        }
        .check {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        .check input {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <nav>
           <a href="/mesh-me/">mesh.me</a>
        <div class="nav-links">
          <a href="/mesh-me/login/">Login</a>
          <a href="/mesh-me/signup/">Sign Up</a>
          <a href="/mesh-me/terms/">Terms</a>
          <a href="/mesh-me/privacy/">Privacy</a>
        </div>
        <h1>Create your mesh</h1>
        <form>
            <label>
                <span>Username</span>
                <input class="mesh-field" type="text" placeholder="username" maxlength="24" required />
            </label>
            <label>
                <span>Email</span>
                <input class="mesh-field" type="email" placeholder="email" required />
            </label>
            <label>
                <span>Password</span>
                <input class="mesh-field" type="password" placeholder="password (10+ chars)" required />
            </label>
            <div class="check">
                <input type="checkbox" required />
                <small>I agree to the <a href="/terms.html">terms</a> and <a href="/privacy.html">privacy</a> policies.</small>
            </div>
            <button type="submit" class="btn-primary">Create Mesh</button>
        </form>
    </div>
</body>
</html>
