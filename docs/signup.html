<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign up · mesh.me</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(to bottom right, #040d21, #0c2945);
      color: #eef4f8;
    }
    header {
      display:flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    .brand a {
      color:#69b1e8;
      text-decoration:none;
      font-size: 1.5rem;
      font-weight:bold;
    }
    .tagline {
      margin-left:0.5rem;
      font-size:1rem;
      color:#899bbd;
    }
    nav a {
      margin-left:1rem;
      color:#89a7d7;
      text-decoration:none;
      font-size:0.9rem;
    }
    nav a:hover {
      color:#b0c7e8;
    }
    .auth {
      max-width: 400px;
      margin: 5rem auto;
      background-color: rgba(4,13,33,0.6);
      padding:2rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .auth h1 {
      margin-top:0;
      text-align:center;
    }
    .auth label {
      display:block;
      margin-bottom:1rem;
    }
    .auth label span {
      display:block;
      margin-bottom:0.25rem;
    }
    .mesh-field {
      width:100%;
      padding:0.5rem;
      border-radius:8px;
      border:none;
      font-size:1rem;
    }
    .auth small {
      display:block;
      margin-top:0.25rem;
      font-size:0.8rem;
      color:#899bbd;
    }
    .check {
      display:flex;
      align-items:center;
      margin-bottom:1rem;
    }
    .check input {
      margin-right:0.5rem;
    }
    .btn {
      display:inline-block;
      padding:0.6rem 1.2rem;
      border-radius:8px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      font-weight:bold;
    }
    .btn.primary {
      background-color:#337ab7;
      color:white;
    }
    .muted {
      text-align:center;
      font-size:0.9rem;
      color:#899bbd;
    }
    footer {
      text-align:center;
      padding:2rem 0;
      color:#6d7ad8;
      font-size:0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <a href="/">mesh.me</a>
      <span class="tagline">Your internet footprint, unified.</span>
    </div>
    <nav>
      <a href="/login">Login</a>
      <a href="/signup">Sign up</a>
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
    </nav>
  </header>
  <main>
    <section class="auth">
      <h1>Create your MeshMe</h1>
      <form>
        <label>
          <span>Username</span>
          <input class="mesh-field" name="username" required />
          <small>3–24 chars, a-z, 0-9, underscore.</small>
        </label>
        <label>
          <span>Email</span>
          <input class="mesh-field" name="email" type="email" required />
        </label>
        <label>
          <span>Password</span>
          <input class="mesh-field" name="password" type="password" required />
        </label>
        <label class="check">
          <input type="checkbox" required />
          <span>I agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</span>
        </label>
        <button class="btn primary" type="submit">Create account</button>
      </form>
      <p class="muted">Already have an account? <a href="/login">Login</a>.</p>
    </section>
  </main>
  <footer>
    &copy; 2026 mesh.me — unified feed and notifications.
  </footer>
</body>
</html>
