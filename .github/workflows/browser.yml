name: browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NEXT_PUBLIC_APP_URL: https://127.0.0.1:3443
      DATABASE_URL: file:./browser-ci.db
      AUTH_SECRET: ci-placeholder-not-a-secret-000000000000
      APP_DATA_ENCRYPTION_KEY: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
      MESH_BROWSER_FIXTURE: local-seed
      MESH_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deterministic timestamps across clocks and timezones
        run: node --import tsx scripts/relative-time-ssr-check.mjs
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run seed
      - run: npm run build
      - name: Allow independent fixture readers alongside real app writes
        run: |
          # Browser tests verify persisted rows through a separate connection.
          # WAL keeps those readers from blocking the app's commit. This changes
          # only the disposable local fixture, never the hosted database.
          python3 <<'PY'
          import os, sqlite3
          from pathlib import Path
          assert os.environ['DATABASE_URL'] == 'file:./browser-ci.db'
          assert not os.environ.get('DATABASE_AUTH_TOKEN') and not os.environ.get('VERCEL')
          database = Path('browser-ci.db')
          assert database.is_file()
          with sqlite3.connect(database) as connection:
              assert connection.execute('SELECT count(*) FROM User').fetchone()[0] >= 10
              assert connection.execute('PRAGMA journal_mode=WAL').fetchone()[0] == 'wal'
          PY
      - name: Start isolated production-mode app over loopback TLS
        id: start_app
        run: |
          CERT_DIR=$(mktemp -d)
          export BROWSER_TEST_CERT="$CERT_DIR/cert.pem"
          export BROWSER_TEST_KEY="$CERT_DIR/key.pem"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$BROWSER_TEST_KEY" -out "$BROWSER_TEST_CERT" \
            -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' 2>/dev/null
          # WebKit's separate networking processes need OS-level fixture trust.
          # This modifies only the disposable hosted runner, never a deployment.
          sudo install -m 0644 "$BROWSER_TEST_CERT" /usr/local/share/ca-certificates/mesh-browser-ci.crt
          sudo update-ca-certificates > /dev/null
          SPKI=$(openssl x509 -in "$BROWSER_TEST_CERT" -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl base64 -A)
          echo "MESH_BROWSER_CERT_SPKI=$SPKI" >> "$GITHUB_ENV"
          setsid nohup npx next start -H 127.0.0.1 -p 3000 > /tmp/browser-server.log 2>&1 &
          setsid nohup node scripts/browser-test-proxy.mjs > /tmp/browser-proxy.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -kfsS https://127.0.0.1:3443/api/health > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          tail -60 /tmp/browser-server.log
          tail -20 /tmp/browser-proxy.log
          exit 1
      - name: Real sign-in, recovery, privacy boundaries, and responsive journeys
        run: node scripts/release-browser-check.mjs
      - name: First account, interrupted signup, and the first real Mesh post
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
        run: node scripts/first-world-browser.mjs
      - name: Preserve isolated fixture screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}
          path: |
            browser-results/**/*.png
            browser-results/**/report.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Server log on failure
        if: failure()
        run: |
          tail -60 /tmp/browser-server.log || true
          tail -20 /tmp/browser-proxy.log || true
