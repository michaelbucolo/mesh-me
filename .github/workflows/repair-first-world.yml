name: Apply first-world resilience
on:
  push:
    branches: [fix/living-world-20260926]
    paths: [.github/workflows/repair-first-world.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - name: Apply bounded account and composer repairs
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/living-world-20260926"
          test "$(git rev-parse HEAD^)" = "9fea0f53e4fd03d95694e84f249a15478fa42b67"
          python3 <<'PY'
          from pathlib import Path
          def edit(name, old, new, expected=1):
            p=Path(name)
            s=p.read_text()
            assert s.count(old)==expected, (name,old,s.count(old))
            p.write_text(s.replace(old,new))
          edit('src/lib/actions.ts',
            'export async function signUp(formData: FormData) {',
            'export async function signUp(formData: FormData, options: { navigate?: boolean } = {}) {')
          edit('src/lib/actions.ts',
            '  if (!sessionId) return { error: "Your sign-in details changed. Please sign in again." };\n  redirect("/onboarding");',
            '  if (!sessionId) return { error: "Your sign-in details changed. Please sign in again." };\n  if (options.navigate === false) return { redirectTo: "/onboarding" as const };\n  redirect("/onboarding");')
          edit('src/components/auth/signup-form.tsx',
            'import { useState, useTransition } from "react";',
            'import { useRef, useState, useTransition } from "react";\nimport { useRouter } from "next/navigation";')
          edit('src/components/auth/signup-form.tsx',
            '  const [values, setValues]',
            '  const router = useRouter();\n  const submitting = useRef(false);\n  const [values, setValues]')
          edit('src/components/auth/signup-form.tsx',
            '    event.preventDefault();\n    const form',
            '    event.preventDefault();\n    if (submitting.current) return;\n    const form')
          edit('src/components/auth/signup-form.tsx',
            '    const data = new FormData(form);\n    startTransition(async () => {\n      const result = await signUp(data);\n      if (result?.error) setError(result.error);\n    });',
            '    const data = new FormData(form);\n    submitting.current = true;\n    startTransition(async () => {\n      try {\n        // Return the destination rather than catching Next\'s redirect sentinel.\n        // A dropped request remains a recoverable form state, not an error page.\n        const result = await signUp(data, { navigate: false });\n        if (result && "error" in result && result.error) setError(result.error);\n        else if (result && "redirectTo" in result) {\n          router.replace(result.redirectTo);\n          router.refresh();\n        }\n      } catch {\n        setError("We couldn\'t reach Mesh.me. Your details are still here — try again.");\n      } finally {\n        submitting.current = false;\n      }\n    });')
          edit('src/components/messages/mechat-thread.tsx',
            '  const sendLock = useRef(false);',
            '  const sendLock = useRef(false);\n  const draftRevision = useRef(0);')
          edit('src/components/messages/mechat-thread.tsx',
            '    const sentDraft = draft;',
            '    const sentDraft = draft;\n    const sentRevision = draftRevision.current;')
          edit('src/components/messages/mechat-thread.tsx',
            '        setDraft((current) => current === sentDraft ? "" : current);',
            '        // Compare edits, not text: typing the same short reply again while a\n        // previous send is pending is still a NEW draft and must survive.\n        const draftUnchanged = draftRevision.current === sentRevision;\n        if (draftUnchanged) setDraft("");')
          edit('src/components/messages/mechat-thread.tsx',
            'if (draftRef.current?.value === sentDraft) sessionStorage.removeItem(draftStorageKey);',
            'if (draftUnchanged) sessionStorage.removeItem(draftStorageKey);')
          edit('src/components/messages/mechat-thread.tsx',
            '                draftTouchedRef.current = true;',
            '                draftRevision.current++;\n                draftTouchedRef.current = true;',2)
          PY
          git rm .github/workflows/repair-first-world.yml
          git add src
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve signup details on interruption and distinguish new identical message drafts'
          git push origin HEAD:fix/living-world-20260926
