name: Apply Mesh refresh repair
on:
  push:
    branches: [fix/living-world-20260926]
    paths: [.github/workflows/repair-mesh-refresh.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - name: Apply bounded scene recovery changes
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/living-world-20260926"
          test "$(git rev-parse HEAD^)" = "ebaea32352f0312c45448e51f428ac03dc564506"
          python3 <<'PY'
          from pathlib import Path
          def edit(name,old,new,expected=1):
            p=Path(name)
            s=p.read_text()
            assert s.count(old)==expected,(name,old,s.count(old))
            p.write_text(s.replace(old,new))
          edit('src/components/mesh/scene/use-mesh-world.ts','{ quiet?: boolean; signal?: AbortSignal }','{ quiet?: boolean; fresh?: boolean; signal?: AbortSignal }',2)
          edit('src/components/mesh/scene/use-mesh-world.ts','      const url = meshApiUrl(viewUserId, viewMode);','      const baseUrl = meshApiUrl(viewUserId, viewMode);\n      const url = loadOpts?.fresh ? `${baseUrl}${baseUrl.includes("?") ? "&" : "?"}refresh=1` : baseUrl;')
          edit('src/components/mesh/scene/use-mesh-world.ts','const prefetched = loadOpts?.quiet ? undefined : takeMeshPrefetch(url);','const prefetched = loadOpts?.quiet || loadOpts?.fresh ? undefined : takeMeshPrefetch(url);')
          edit('src/components/mesh/scene/mesh-surface.tsx','onRetry={() => router.refresh()}','onRetry={() => void world.loadScene({ fresh: true })}')
          edit('src/components/mesh/scene/mesh-surface.tsx','world.loadScene({ quiet: true })','world.loadScene({ quiet: true, fresh: true })',3)
          edit('src/app/api/mesh/route.ts','  const cachedPayload = getMeshCache(user.id);','  // A write may have landed on a different serverless instance. Explicit\n  // post-write refreshes must not reuse this process\'s older scene. Ordinary\n  // background polling retains the bounded cache; authorization runs first.\n  const cachedPayload = searchParams.get("refresh") === "1" ? undefined : getMeshCache(user.id);')
          edit('src/components/mesh/scene/mesh-prefetch.ts','  meshPrefetches.set(url, {\n    promise: fetch(url, { cache: "no-store" }),','  const promise = fetch(url, { cache: "no-store" });\n  // The scene chunk may arrive after the request fails. Observe rejection\n  // immediately, while retaining the rejected promise for its recovery UI.\n  void promise.catch(() => {});\n  meshPrefetches.set(url, {\n    promise,')
          edit('.github/workflows/browser.yml','      - name: Start isolated production-mode app over loopback TLS','      - name: Start isolated production-mode app over loopback TLS\n        id: start_app')
          edit('.github/workflows/browser.yml','      - name: First account, interrupted signup, and the first real Mesh post\n        run:',"      - name: First account, interrupted signup, and the first real Mesh post\n        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}\n        run:")
          PY
          git rm .github/workflows/repair-mesh-refresh.yml
          git add src .github/workflows/browser.yml
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retry failed Mesh requests and bypass stale scene data after writes'
          git push origin HEAD:fix/living-world-20260926
