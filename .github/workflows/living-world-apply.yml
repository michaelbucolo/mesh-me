name: Apply living world repair
on:
  push:
    branches: [fix/living-world-20260926]
    paths: [scripts/living-world.patch.gz.b64]
permissions:
  contents: write
concurrency:
  group: apply-living-world-repair
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply checksum-verified patch and retire one-time tooling
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/living-world-20260926"
          base64 --decode scripts/living-world.patch.gz.b64 | gzip -d > /tmp/living-world.patch
          echo 'a9fce3465170041c84f8f1ace57ef2f138dcc5f75100e7d4797baee99c55dbb5  /tmp/living-world.patch' | sha256sum -c -
          git apply --check /tmp/living-world.patch
          git apply /tmp/living-world.patch
          git rm scripts/living-world.patch.gz.b64 .github/workflows/living-world-apply.yml .github/workflows/living-world-audit.yml
          git add src scripts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore the living entry, repair recovery routes, and preserve in-flight message drafts'
          git push origin HEAD:fix/living-world-20260926
