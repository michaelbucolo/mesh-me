<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Meshi body - perfect circle -->
  <circle cx="32" cy="32" r="28" fill="#2d7ff9" />
  <circle cx="32" cy="32" r="26" fill="url(#meshiGrad)" />
  <!-- Gradient -->
  <defs>
    <radialGradient id="meshiGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2d7ff9" />
    </radialGradient>
  </defs>
  <!-- Glow ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.4" />
  <!-- Eyes - the signature Meshi look -->
  <text x="32" y="38" text-anchor="middle" font-size="18" fill="white" font-family="system-ui">◕ ◕</text>
</svg>
