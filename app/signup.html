{% extends "base.html" %}
{% set minimal = true %}
{% block title %}Create Mesh — mesh.me{% endblock %}
{% block content %}
<div class="mm-wordmark">
  <span class="mm-mesh">mesh</span><span class="mm-dot">.</span><span class="mm-me">me</span>
</div>

<div class="mm-card">
  <div class="mm-label">create your mesh</div>

  {% if error %}
    <div class="mm-alert">{{ error }}</div>
  {% endif %}

  <form class="mm-form" action="/signup" method="post" autocomplete="on">
    <input class="mm-input mesh-field" name="username" placeholder="username" maxlength="24" required />
    <input class="mm-input mesh-field" type="email" name="email" placeholder="email" required />
    <input class="mm-input mesh-field" type="password" name="password" placeholder="password (10+ chars)" required minlength="10" />
    <button class="mm-btn mm-primary" type="submit">Create Mesh</button>
  </form>

  <div class="mm-divider"></div>
  <a class="mm-btn" href="/">Back</a>
</div>
{% endblock %}
