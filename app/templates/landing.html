{% extends "base.html" %}
{% set minimal = true %}
{% block title %}mesh.me{% endblock %}
{% block content %}
<canvas id="meshbg" aria-hidden="true"></canvas>

<div class="mm-wordmark">
  <span class="mm-mesh">mesh</span><span class="mm-dot">.</span><span class="mm-me">me</span>
</div>

<div class="mm-card">
  <div class="mm-label">enter your mesh</div>

  {# Display an error if provided by the server #}
  {% if error %}
    <div class="mm-alert">{{ error }}</div>
  {% endif %}

  <form class="mm-form" action="/login" method="post" autocomplete="on">
    <input class="mm-input mesh-field" name="identifier" placeholder="username or email" autocomplete="username" required />
    <input class="mm-input mesh-field" name="password" type="password" placeholder="password" autocomplete="current-password" required />
    <button class="mm-btn mm-primary" type="submit">Enter Mesh</button>
  </form>

  <div class="mm-divider"></div>
  <a class="mm-btn" href="/signup">Create Mesh</a>
  <div class="mm-hint">public: /@username</div>
</div>

<script src="/static/meshbg.js"></script>
<script>
(function(){
  if(!window.MeshBG) return;
  window.MeshBG.mount({ canvasId: 'meshbg' });

  const fields = Array.from(document.querySelectorAll('.mesh-field'));
  function setActive(el){ window.MeshBG.setTargetElement(el); }
  fields.forEach(el=>{
    el.addEventListener('focus', ()=>setActive(el));
    el.addEventListener('input', ()=>setActive(el));
  });
  setActive(fields[0] || null);
})();
</script>
{% endblock %}
