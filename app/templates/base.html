<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}mesh.me{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css?v=1" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    {% set is_minimal = minimal if minimal is defined else False %}
    {% if not is_minimal %}
      <header class="topbar"><a class="brand" href="/">mesh.me</a></header>
    {% endif %}
    <main class="page {% if is_minimal %}page-minimal{% endif %}">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
