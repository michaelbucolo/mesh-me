{% extends "base.html" %}
{% block title %}Send Message — mesh.me{% endblock %}
{% block content %}
<div class="mm-card" style="padding:32px; max-width:600px; margin:0 auto;">
  <h1 style="margin-top:0;">Send Message</h1>
  <form method="post" style="display:flex; flex-direction:column; gap:16px;">
    <div>
      <label for="recipient_id">Recipient:</label><br>
      <select class="mm-input" id="recipient_id" name="recipient_id" required style="width:100%;">
        {% for r in recipients %}
          <option value="{{ r.id }}">{{ r.username }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="message">Message:</label><br>
      <textarea class="mm-input" id="message" name="message" rows="5" required style="width:100%;"></textarea>
    </div>
    <button class="mm-btn mm-primary" type="submit">Send</button>
  </form>
</div>
{% endblock %}
