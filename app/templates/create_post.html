{% extends "base.html" %}
{% block title %}Create Post — mesh.me{% endblock %}
{% block content %}
<div class="mm-card" style="padding:32px; max-width:600px; margin:0 auto;">
  <h1 style="margin-top:0;">Create New Post</h1>
  {% if error %}
    <div class="mm-alert" style="margin-bottom:12px;">{{ error }}</div>
  {% endif %}
  <form method="post" style="display:flex; flex-direction:column; gap:16px;">
    <div>
      <label for="title">Title:</label><br>
      <input class="mm-input" type="text" id="title" name="title" required style="width:100%;">
    </div>
    <div>
      <label for="content">Content:</label><br>
      <textarea class="mm-input" id="content" name="content" rows="5" required style="width:100%;"></textarea>
    </div>
    <button class="mm-btn mm-primary" type="submit">Post</button>
  </form>
</div>
{% endblock %}
