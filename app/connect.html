{% extends "base.html" %}
{% block title %}Manage Connections — mesh.me{% endblock %}
{% block content %}
<div class="mm-card" style="padding:32px;">
  <h1 style="margin-top:0;">Manage Connections</h1>
  <form method="post">
    <p>Select the platforms you'd like to connect:</p>
    {% for platform in supported_platforms %}
    <div style="margin-bottom:8px;">
      <input type="checkbox" name="platforms" value="{{ platform }}" id="plat-{{ platform }}" {% if platform in user.preferences.connected_platforms %}checked{% endif %}>
      <label for="plat-{{ platform }}">{{ platform|capitalize }}</label>
    </div>
    {% endfor %}
    <button class="mm-btn mm-primary" type="submit" style="margin-top:16px;">Save Connections</button>
  </form>
</div>
{% endblock %}
